[workspace]
members = ["crates/delirium-data", "crates/delirium", "crates/bo1-worker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[profile.release]
debug = 0
strip = "symbols"
lto = "off"
codegen-units = 16


[workspace.metadata.delirium-upstream]
repository = "https://github.com/PVCPC/delirium-physics"
revision = "93eed4d6a0aafa2e84526730ea1f54dab48ac7d4"
# Official Delirium core and game-program data loader.
# BO1 host adapters retain removed-part masks, sole contacts and persistent worker pools.
