[package]
name = "delirium"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
portal = []
bevy = ["dep:bevy_ecs"]

[dependencies]
delirium-data = { path = "../delirium-data" }
bevy_math = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_transform = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_tasks = { version = "=0.20.0", default-features = false, features = ["multi_threaded"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
rayon = "=1.11.0"
bevy_ecs = { version = "=0.18.1", optional = true }
